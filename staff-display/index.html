<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, "Noto Sans Devanagari", sans-serif;
    background: linear-gradient(160deg, #1ea952 0%, #25D366 55%, #1fbf5c 100%);
    color: #fff;
    padding-bottom: 40px;
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #075E54, #128C7E);
    color: #fff;
    padding: 18px 18px;
    text-align: center;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: .3px;
    text-shadow: 0 1px 6px rgba(0,0,0,.25);
    box-shadow: 0 3px 16px rgba(7,94,84,.45);
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .header-icon { display: inline-flex; }
  #ordersWrap {
    max-width: 640px;
    margin: 16px auto;
    padding: 0 12px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .empty-msg {
    text-align: center;
    color: rgba(255,255,255,.85);
    padding: 60px 20px;
    font-size: 15px;
    font-weight: 600;
  }
  .order-card {
    position: relative;
    background: #1DA851;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,.18);
    overflow: hidden;
    animation: cardIn .28s ease-out;
  }
  .order-card::before {
    content: "";
    display: block;
    height: 4px;
    background: linear-gradient(90deg, #075E54, #FFD54A, #075E54);
  }
  @keyframes cardIn { from{ opacity:0; transform:translateY(-10px); } to{ opacity:1; transform:translateY(0); } }
  .order-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 14px;
    gap: 10px;
    cursor: pointer;
  }
  .order-head-left { min-width: 0; }
  .order-cust {
    font-size: 16.5px;
    font-weight: 800;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .order-meta {
    font-size: 13px;
    color: rgba(255,255,255,.85);
    margin-top: 3px;
    font-weight: 600;
  }
  .order-timer-row {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 13.5px;
    font-weight: 800;
    margin-top: 5px;
  }
  .order-timer-row .timer-icon { display: inline-flex; align-items: center; }
  .order-timer-row.running { color: #FFD54A; }
  .order-timer-row.done { color: #fff; }
  .order-sent {
    font-size: 11.5px;
    color: rgba(255,255,255,.7);
    margin-top: 4px;
  }
  .order-head-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .status-icon { display: inline-flex; align-items: center; }
  .icon-done { color: #2969f0; background: #fff; border-radius: 50%; padding: 2px; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .icon-pending { color: #FFD54A; }
  .icon-th { color: rgba(255,255,255,.75); vertical-align: middle; }
  .arrow-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #075E54, #128C7E);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .2s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  .order-card.expanded .arrow-btn { transform: rotate(180deg); }
  .order-body {
    display: none;
    border-top: 1px solid rgba(255,255,255,.2);
    padding: 4px 10px 12px;
  }
  .order-card.expanded .order-body { display: block; }
  table.item-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
    color: #fff;
  }
  table.item-table th {
    text-align: left;
    font-size: 11.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,.75);
    padding: 8px 4px 4px;
    border-bottom: 1px solid rgba(255,255,255,.2);
  }
  table.item-table td {
    padding: 8px 4px;
    border-bottom: 1px solid rgba(255,255,255,.15);
    vertical-align: middle;
  }
  table.item-table tr.row-checked td { background: rgba(255,255,255,.12); }
  .sl-col { width: 26px; color: rgba(255,255,255,.7); font-weight: 700; }
  .name-col { font-weight: 700; }
  .num-col { text-align: right; white-space: nowrap; }
  .chk-col { text-align: center; width: 34px; }
  .chk-col input[type="checkbox"] {
    width: 22px;
    height: 22px;
    accent-color: #FFD54A;
    cursor: pointer;
  }
  .order-total-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 4px 2px;
    font-weight: 800;
    font-size: 14px;
    color: #FFD54A;
  }

  /* New-order alert overlay */
  #staffAlertOverlay {
    position: fixed;
    inset: 0;
    z-index: 999999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 22px;
    background: rgba(0,0,0,.6);
  }
  .staff-alert-box {
    width: min(94vw, 420px);
    background: #fff;
    border-radius: 20px;
    padding: 26px 20px 20px;
    text-align: center;
    box-shadow: 0 18px 60px rgba(0,0,0,.35);
    animation: alertPop .22s ease-out;
  }
  @keyframes alertPop { from{ transform:scale(.9); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .staff-alert-emoji { display: flex; justify-content: center; color: #af0058; margin-bottom: 8px; }
  .staff-alert-title { font-size: 21px; font-weight: 800; color: #af0058; margin-bottom: 8px; }
  .staff-alert-body { font-size: 16px; font-weight: 600; color: #333; line-height: 1.5; }
  .staff-alert-ok {
    margin-top: 18px;
    width: 100%;
    border: 0;
    background: linear-gradient(135deg, #ff7a18, #af0058);
    color: #fff;
    border-radius: 12px;
    padding: 13px 10px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
  }

  /* Online order card — sky blue */
  .order-card.online { background: #1E9FE8; border-color: rgba(255,255,255,.45); }
  .order-card.online::before { background: linear-gradient(90deg, #0b6fb3, #fff, #0b6fb3); }
  .order-card.online .arrow-btn { background: linear-gradient(135deg, #0b6fb3, #1E9FE8); }
  .online-badge { display:inline-block; background:#fff; color:#0b6fb3; font-size:11.5px; font-weight:800; letter-spacing:.5px; border-radius:8px; padding:2px 8px; margin-bottom:5px; }
  .dp-line { font-size:12.5px; color:#fff; margin-top:4px; font-weight:700; }
  .dp-line.done { color:#d7ffe3; }
  .order-info { padding:8px 4px 4px; font-size:13px; color:#fff; line-height:1.5; }
  .order-info a { color:#fff; text-decoration:underline; font-weight:700; }
</style>

<script>window.CLD_SCOPE='staff';</script>
<script id="cldphoto">
/* Item ki photo: phone par chhoti karo -> Vercel se signature -> Cloudinary par upload -> https link */
window.cldResize = function(file, max){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onerror = function(){ rej(new Error('Photo padh nahi paye')); };
    fr.onload = function(){
      var im = new Image();
      im.onerror = function(){ rej(new Error('Ye photo khul nahi rahi')); };
      im.onload = function(){
        var r = Math.min(1, max / Math.max(im.width, im.height)), w = Math.round(im.width * r), h = Math.round(im.height * r);
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(im, 0, 0, w, h);
        c.toBlob(function(b){ b ? res(b) : rej(new Error('Photo chhoti nahi ho payi')); }, 'image/jpeg', 0.8);
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
};
window.cldUpload = async function(file, ready){
  var u = window.currentFirebaseUser;
  if(!u || (u.isAnonymous && window.CLD_SCOPE !== 'staff')) throw new Error('Pehle apne account se login karein');
  var blob = ready ? file : await window.cldResize(file, 640);
  var tok = await u.getIdToken();
  var sr = await fetch('/api/cloudinary-sign', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ idToken: tok, scope: window.CLD_SCOPE || '' }) });
  var sg = await sr.json().catch(function(){ return {}; });
  if(!sr.ok) throw new Error(sg.error || 'Upload ki permission nahi mili');
  var fd = new FormData();
  fd.append('file', blob, 'item.jpg'); fd.append('api_key', sg.apiKey); fd.append('timestamp', sg.timestamp);
  fd.append('signature', sg.signature); fd.append('folder', sg.folder); fd.append('allowed_formats', sg.allowed_formats);
  var ur = await fetch('https://api.cloudinary.com/v1_1/' + sg.cloudName + '/image/upload', { method: 'POST', body: fd });
  var ud = await ur.json().catch(function(){ return {}; });
  if(!ur.ok || !ud.secure_url) throw new Error((ud.error && ud.error.message) || 'Photo upload nahi hui');
  return ud.secure_url;
};
// Photo ko shop ke square (1:1) frame mein zoom/move karke set karne wali window. Cancel par null.
window.cldCrop = function(file){
  return new Promise(function(resolve){
    var url = URL.createObjectURL(file), im = new Image();
    im.onerror = function(){ URL.revokeObjectURL(url); alert('Ye photo khul nahi rahi'); resolve(null); };
    im.onload = function(){
      var F = Math.min(Math.round(window.innerWidth * 0.86), 360), W = im.naturalWidth, H = im.naturalHeight;
      var fit = F / Math.max(W, H), z = 1, tx = 0, ty = 0;
      var ov = document.createElement('div'); ov.id = 'cldCropOverlay';
      ov.style.cssText = 'position:fixed;inset:0;z-index:2147483200;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;font-family:sans-serif';
      ov.innerHTML = '<div style="color:#fff;font-weight:800;font-size:17px;margin-bottom:4px">Photo set karein</div>'
        + '<div style="color:#ddd;font-size:13px;margin-bottom:10px;text-align:center">Photo shop ke card mein poore square mein bharkar dikhegi. Neeche ki dhundhli patti par card ka quantity/ADD button aayega. Ungli se khiskayein, do ungli se zoom karein.</div>'
        + '<div id="cldFrame" style="position:relative;width:' + F + 'px;height:' + F + 'px;background:#fff;border-radius:14px;overflow:hidden;touch-action:none;box-shadow:0 0 0 2px #fff"><div style="position:absolute;left:0;right:0;bottom:0;height:18%;background:rgba(239,239,242,.82);border-top:2px dashed #888;z-index:2;pointer-events:none;display:flex;align-items:center;padding:0 10px;font-size:12px;color:#555;font-weight:700">1 pcs · ADD (yahan patti aayegi)</div></div>'
        + '<div style="display:flex;align-items:center;gap:10px;width:' + F + 'px;margin:14px 0 4px;color:#fff"><span style="font-size:20px">−</span><input id="cldZoom" type="range" min="1" max="6" step="0.01" value="1" style="flex:1"><span style="font-size:20px">+</span></div>'
        + '<div style="display:flex;gap:10px;width:' + F + 'px;margin-top:10px"><button type="button" id="cldReset" style="flex:1;border:0;border-radius:12px;padding:13px;font-weight:800;background:#e8eefc;color:#1a3a8a">Reset</button><button type="button" id="cldCancel" style="flex:1;border:0;border-radius:12px;padding:13px;font-weight:800;background:#444;color:#fff">Cancel</button><button type="button" id="cldOk" style="flex:1.4;border:0;border-radius:12px;padding:13px;font-weight:800;background:#1a7a3e;color:#fff">✓ Upload</button></div>';
      document.body.appendChild(ov);
      var fr = ov.querySelector('#cldFrame'), zr = ov.querySelector('#cldZoom');
      im.style.cssText = 'position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;user-select:none;-webkit-user-drag:none;pointer-events:none';
      im.width = W; im.height = H; fr.appendChild(im);
      function apply(){ im.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + (fit * z) + ')'; zr.value = z; }
      function reset(){ z = 1; tx = (F - W * fit) / 2; ty = (F - H * fit) / 2; apply(); }
      function zoomTo(nz, cx, cy){ nz = Math.min(6, Math.max(1, nz)); var k = nz / z, s0 = fit * z; var ix = (cx - tx) / s0, iy = (cy - ty) / s0; z = nz; var s1 = fit * z; tx = cx - ix * s1; ty = cy - iy * s1; apply(); }
      reset();
      var pts = {}, lastD = 0, lastX = 0, lastY = 0;
      function rel(e){ var r = fr.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
      fr.addEventListener('pointerdown', function(e){ fr.setPointerCapture(e.pointerId); pts[e.pointerId] = rel(e); lastD = 0; lastX = e.clientX; lastY = e.clientY; });
      fr.addEventListener('pointermove', function(e){
        if(!pts[e.pointerId]) return;
        pts[e.pointerId] = rel(e); var ids = Object.keys(pts);
        if(ids.length >= 2){
          var a = pts[ids[0]], b = pts[ids[1]], d = Math.hypot(a.x - b.x, a.y - b.y);
          if(lastD) zoomTo(z * d / lastD, (a.x + b.x) / 2, (a.y + b.y) / 2);
          lastD = d;
        } else { tx += e.clientX - lastX; ty += e.clientY - lastY; apply(); }
        lastX = e.clientX; lastY = e.clientY;
      });
      function up(e){ delete pts[e.pointerId]; lastD = 0; lastX = e.clientX; lastY = e.clientY; }
      fr.addEventListener('pointerup', up); fr.addEventListener('pointercancel', up);
      fr.addEventListener('wheel', function(e){ e.preventDefault(); var p = rel(e); zoomTo(z * (e.deltaY < 0 ? 1.1 : 0.9), p.x, p.y); }, { passive: false });
      zr.addEventListener('input', function(){ zoomTo(parseFloat(zr.value), F / 2, F / 2); });
      ov.querySelector('#cldReset').onclick = reset;
      function done(v){ ov.remove(); URL.revokeObjectURL(url); resolve(v); }
      ov.querySelector('#cldCancel').onclick = function(){ done(null); };
      ov.querySelector('#cldOk').onclick = function(){
        var OUT = 600, r = OUT / F, c = document.createElement('canvas'); c.width = OUT; c.height = OUT;
        var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, OUT, OUT);
        x.drawImage(im, tx * r, ty * r, W * fit * z * r, H * fit * z * r);
        c.toBlob(function(b){ done(b); }, 'image/jpeg', 0.85);
      };
    };
    im.src = url;
  });
};
// Camera / gallery chunne ke liye: cb(url) milta hai
window.cldPick = function(cb, busy){
  var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async function(){
    var f = inp.files && inp.files[0]; if(!f) return;
    var blob = await window.cldCrop(f); if(!blob) return;
    if(busy) busy(true);
    try { cb(await window.cldUpload(blob, true)); }
    catch(e){ alert('❌ ' + (e && e.message || 'Photo upload nahi hui') + '\\n\\nItem bina photo ke save ho sakta hai, baad mein photo jod sakte hain.'); }
    if(busy) busy(false);
  };
  inp.click();
};
// Internet (free-license) se item ki photo dhundhna: Wikimedia Commons + Openverse
window.cldWebSearch = async function(q){
  var out = [], enc = encodeURIComponent(q);
  function ok(u){ return typeof u === 'string' && /^https:\/\//.test(u); }
  var jobs = [
    fetch('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=12&gsrsearch=' + enc + '&prop=imageinfo&iiprop=url|mime&iiurlwidth=700')
      .then(function(r){ return r.json(); }).then(function(d){
        Object.values((d.query && d.query.pages) || {}).forEach(function(pg){
          var ii = pg.imageinfo && pg.imageinfo[0];
          if(ii && /^image\/(jpeg|png|webp)$/.test(ii.mime || '') && ok(ii.thumburl || ii.url)) out.push({ t: ii.thumburl || ii.url, src: 'Wikimedia' });
        });
      }).catch(function(){}),
    fetch('https://api.openverse.org/v1/images/?page_size=12&mature=false&q=' + enc)
      .then(function(r){ return r.json(); }).then(function(d){
        (d.results || []).forEach(function(x){ var u = x.thumbnail || x.url; if(ok(u)) out.push({ t: u, src: 'Openverse' }); });
      }).catch(function(){})
  ];
  await Promise.all(jobs);
  return out.slice(0, 20);
};

    + '<div style="padding:0 14px 6px;display:flex;gap:8px"><input id="cldWebQ" style="flex:1;padding:11px;border:1.5px solid #cfd8e3;border-radius:12px;font-size:16px;min-width:0" placeholder="Item ka naam (English mein behtar)"><button type="button" id="cldWebGo" style="border:0;background:#1a56c4;color:#fff;border-radius:12px;padding:0 16px;font-weight:800">Search</button></div>'
    + '<div style="padding:0 14px 6px;font-size:12px;color:#666">Free-license photos hain. Packet wale (brand) items ki photo na mile to apni khud ki asli photo lagayein.</div>'

  document.body.appendChild(ov);
  var qi = ov.querySelector('#cldWebQ'), res = ov.querySelector('#cldWebRes'); qi.value = query || '';
  function close(){ ov.remove(); }
  ov.querySelector('#cldWebX').onclick = close;

  async function go(){

    res.style.display = 'grid';
    res.innerHTML = list.map(function(x, i){ return '<button type="button" data-i="' + i + '" style="border:1px solid #dde3ea;border-radius:12px;padding:0;background:#f6f8fa;aspect-ratio:1/1;overflow:hidden"><img src="' + x.t.replace(/"/g, '&quot;') + '" alt="" loading="lazy" referrerpolicy="no-referrer" style="width:100%;height:100%;object-fit:cover" onerror="this.parentNode.style.display=\'none\'"></button>'; }).join('');
    res._list = list;
  }
  res.addEventListener('click', async function(e){
    var b = e.target.closest && e.target.closest('button[data-i]'); if(!b || !res._list) return;
    var x = res._list[parseInt(b.getAttribute('data-i'), 10)]; if(!x) return;
    var blob = null;
    try { var r = await fetch(x.t); if(r.ok) blob = await r.blob(); } catch(err){}
    if(!blob){ if(confirm('Ye photo set karne wali window mein nahi khul payi. Seedha isi photo ko laga dein?')){ close(); cb(x.t); } return; }

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  // Same Firebase project the Mittu billing phone uses.
  const firebaseConfig = {
    apiKey: "AIzaSyDQ-fm6-_bs728n6rcUS-XS9Zl-hqbIQhA",
    authDomain: "mittu-billing.firebaseapp.com",
    databaseURL: "https://mittu-billing-default-rtdb.firebaseio.com",

  const fbApp = initializeApp(firebaseConfig);

  let latestOrders = {};           // sabse recent snapshot, checkbox click par turant hisaab lagane ke liye

  // ---------------- ICONS (emoji ki jagah simple professional SVG) ----------------
  // Bold tick jaisa "done" checkmark (reference image jaisa) — solid fill,
  // outline circle nahi.
  function iconCheck(colorClass){

  function iconChevronDown(colorClass){

  }
  function iconReceipt(colorClass){
    return `<svg class="icon ${colorClass}" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2V2z"/><line x1="9" y1="7" x2="15" y2="7"/><line x1="9" y1="11" x2="15" y2="11"/><line x1="9" y1="15" x2="12" y2="15"/></svg>`;
  }
  function iconBell(colorClass){
    return `<svg class="icon ${colorClass}" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>`;
  }

  document.getElementById('headerIcon').innerHTML = iconReceipt('');
  document.getElementById('staffAlertEmoji').innerHTML = iconBell('');

  function escHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[c]));
  }

  function dpLine(o){
    const dp = o.deliveryPartner || {};
    const st = o.deliveryStatus;
    const stTxt = st === 'delivered' ? ' · ✅ Deliver ho gaya' : st === 'out' ? ' · 🛵 Nikal gaya' : '';
    const who = dp.name || dp.phone ? ('🛵 ' + escHtml(dp.name || 'Delivery partner') + (dp.phone ? ' (' + escHtml(dp.phone) + ')' : '')) : '🛵 Delivery partner tay nahi';
    return `<div class="dp-line ${st === 'delivered' ? 'done' : ''}">${who}${stTxt}</div>`;
  }
  function onlineInfo(o){
    return `<div class="order-info">${o.orderId ? 'Order: <b>' + escHtml(o.orderId) + '</b> · ' : ''}${o.pay === 'ONLINE' ? '💳 Online paid' : o.pay === 'UPI' ? 'UPI (delivery par)' : 'Cash on delivery'}</div>`;
  }

  function toggleCard(orderId){
    if(expandedIds.has(orderId)) expandedIds.delete(orderId);
    else expandedIds.add(orderId);
    const el = document.querySelector(`.order-card[data-id="${orderId}"]`);
    if(el) el.classList.toggle('expanded');
  }
  window.__toggleStaffCard = toggleCard;

  // Pehle ye sirf 'checked' field update karta tha, aur completedTs (jisse
  // timer rukta hai) ek ALAG listener round-trip mein baad mein set hota
  // tha — isi wajah se sab items tick karne ke baad bhi timer kabhi-kabhi
  // rukta nahi tha. Ab checkbox dabate hi, yahin turant hisaab lagakar,
  // 'checked' aur 'completedTs' dono ek hi Firebase request mein saath
  // save kar rahe hain, isliye timer turant aur bharosemand tareeke se
  // rukta hai.
  function toggleItemChecked(orderId, idx, isChecked){
    const order = latestOrders[orderId] || {};
    const items = Array.isArray(order.items) ? order.items : [];
    const updatedChecked = Object.assign({}, order.checked || {});
    updatedChecked[idx] = isChecked;
    const checkedCount = items.filter((_, i) => updatedChecked[i]).length;
    const allChecked = items.length > 0 && checkedCount === items.length;

    const updates = {};
    updates[`checked/${idx}`] = isChecked;
    updates.completedTs = allChecked ? Date.now() : null;

    update(ref(fbDb, `staffOrders/${orderId}`), updates)
      .catch(err => console.warn('Check update failed:', err));
  }
  window.__toggleStaffItem = toggleItemChecked;

  function formatDuration(ms){
    const totalSec = Math.max(0, Math.floor(ms / 1000));
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return `${m} min ${s} sec`;
  }

  function formatSentDateTime(ts){
    if(!ts) return '';
    return new Date(ts).toLocaleString('en-IN', {
      day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
    });
  }

  // Jaise hi kisi order ke saare items check ho jaate hain, uska completedTs
  // Firebase mein save kar dete hain — isse timer hamesha ke liye us waqt
  // par ruk jaata hai (page reload hone par bhi). Agar staff koi item wapas
  // uncheck kar de, to completedTs hata dete hain aur timer phir se chalne
  // lagta hai.
  function syncCompletionTimestamps(ordersObj){
    Object.keys(ordersObj || {}).forEach(id => {
      if(id.charAt(0) === '_') return;
      const order = ordersObj[id];
      const items = Array.isArray(order.items) ? order.items : [];
      if(!items.length) return;
      const checked = order.checked || {};
      const checkedCount = items.filter((_, i) => checked[i]).length;
      const allChecked = checkedCount === items.length;
      if(allChecked && !order.completedTs){
        update(ref(fbDb, `staffOrders/${id}`), { completedTs: Date.now() }).catch(() => {});
      } else if(!allChecked && order.completedTs){
        update(ref(fbDb, `staffOrders/${id}`), { completedTs: null }).catch(() => {});
      }
    });
  }

  // Har second, jo timer abhi "running" hain (completedTs nahi hai) unka
  // text update karte hain — poora card wapas render karne ki zaroorat nahi.
  setInterval(() => {
    document.querySelectorAll('.order-timer[data-completed=""]').forEach(el => {
      const start = Number(el.dataset.start) || Date.now();
      el.textContent = formatDuration(Date.now() - start);
    });
  }, 1000);

  // ---------------- TABS + ORDER COMPLETE PAGE ----------------
  let mainTab = 'all';       // all | phys | online
  let doneTab = 'all';       // all | phys | online (Order Complete page)
  function isDone(o){
    const items = Array.isArray(o.items) ? o.items : [];
    const checked = o.checked || {};
    return items.length > 0 && items.filter((_, i) => checked[i]).length === items.length;
  }
  function typeOk(o, tab){ return tab === 'all' || (tab === 'online' ? o.type === 'online' : o.type !== 'online'); }
  function renderTabs(){
    const defs = [['all','All'],['phys','Physical Order'],['online','Online Order']];
    document.getElementById('mainTabs').innerHTML = defs.map(d => `<button type="button" class="tab ${mainTab===d[0]?'on':''}" data-t="${d[0]}">${d[1]}</button>`).join('')
      + '<button type="button" class="tab done-btn" id="openDone">Order Complete</button>';
    const dn = [['all','All'],['phys','Physical Order Complete'],['online','Online Order Complete']];
    document.getElementById('doneTabs').innerHTML = dn.map(d => `<button type="button" class="tab ${doneTab===d[0]?'on':''}" data-t="${d[0]}">${d[1]}</button>`).join('');
  }
  document.addEventListener('click', e => {
    const t = e.target.closest('.tab'); if(!t) return;
    if(t.id === 'openDone'){ document.getElementById('donePage').classList.add('show'); renderOrders(latestOrders); return; }
    if(t.closest('#mainTabs')) mainTab = t.dataset.t; else doneTab = t.dataset.t;
    renderOrders(latestOrders);
  });
  document.getElementById('doneBack').addEventListener('click', () => document.getElementById('donePage').classList.remove('show'));

  function renderOrders(ordersObj){
    renderTabs();
    renderInto(ordersWrap, ordersObj, o => (mainTab === 'all' || !isDone(o)) && typeOk(o, mainTab), 'Abhi tak koi order nahi aaya hai…');
    renderInto(document.getElementById('doneWrap'), ordersObj, o => isDone(o) && typeOk(o, doneTab), 'Abhi koi order complete nahi hua hai');
  }

  function renderInto(container, ordersObj, pred, emptyText){
    const ids = Object.keys(ordersObj || {}).filter(id => id.charAt(0) !== '_' && pred(ordersObj[id] || {}));
    if(!ids.length){
      container.innerHTML = '';
      const m = container === ordersWrap ? emptyMsg : document.createElement('div');
      m.className = 'empty-msg'; if(container !== ordersWrap || !emptyMsg.dataset.err) m.textContent = emptyText;
      container.appendChild(m);
      return;
    }
    // Naya order sabse upar — timestamp ke hisaab se sort.
    const sorted = ids
      .map(id => Object.assign({ id }, ordersObj[id]))
      .sort((a, b) => (b.ts || 0) - (a.ts || 0));

    container.innerHTML = '';
    sorted.forEach(order => {
      const items = Array.isArray(order.items) ? order.items : [];
      const checked = order.checked || {};
      const checkedCount = items.filter((_, i) => checked[i]).length;
      const allChecked = items.length > 0 && checkedCount === items.length;
      const statusIcon = allChecked ? iconCheck('icon-done') : iconClock('icon-pending');
      const isExpanded = expandedIds.has(order.id);
      const completedTs = order.completedTs || '';
      const timerMs = completedTs ? (completedTs - order.ts) : (Date.now() - order.ts);
      const timerText = formatDuration(timerMs);
      const timerRowClass = completedTs ? 'done' : 'running';
      const timerIcon = completedTs ? iconCheck('icon-done') : iconClock('icon-pending');

      const card = document.createElement('div');
      card.className = 'order-card' + (order.type === 'online' ? ' online' : '') + (isExpanded ? ' expanded' : '');
      card.dataset.id = order.id;

      const rowsHtml = items.map((it, i) => {
        const isChecked = !!checked[i];
        return `
          <tr class="${isChecked ? 'row-checked' : ''}">
            <td class="sl-col">${i + 1}.</td>
            <td class="name-col">${escHtml(it.name)}</td>
            <td class="num-col">${escHtml(it.qty)}${it.unit ? ' ' + escHtml(it.unit) : ''}</td>
            ${order.type === 'online' ? '' : `<td class="num-col">${escHtml(it.rate != null ? Number(it.rate).toFixed(2) : '0.00')}₹/${escHtml(it.unit || 'pcs')}</td>`}
            <td class="num-col">₹${escHtml(Number(it.amt || 0).toFixed(2))}</td>
            <td class="chk-col">
              <input type="checkbox" ${isChecked ? 'checked' : ''}
                onchange="window.__toggleStaffItem('${order.id}', ${i}, this.checked)">
            </td>
          </tr>`;
      }).join('');

      card.innerHTML = `
        <div class="order-head" onclick="window.__toggleStaffCard('${order.id}')">
          <div class="order-head-left">
            ${order.type === 'online' ? '<div class="online-badge">🛒 ONLINE ORDER</div>' : ''}
            <div class="order-cust">${escHtml(order.custName || 'Customer')}</div>
            <div class="order-meta">${items.length} item${items.length > 1 ? 's' : ''} &middot; ₹${escHtml(Number(order.totalAmount || 0).toFixed(2))}</div>
            <div class="order-timer-row ${timerRowClass}">
              <span class="timer-icon">${timerIcon}</span>
              <span class="order-timer" id="timer-${order.id}" data-start="${order.ts}" data-completed="${completedTs}">${timerText}</span>
            </div>
            ${order.type === 'online' ? dpLine(order) : ''}
            <div class="order-sent">Bheja gaya: ${escHtml(formatSentDateTime(order.ts))}</div>
          </div>
          <div class="order-head-right">
            <span class="status-icon">${statusIcon}</span>
            <button type="button" class="arrow-btn" aria-label="Expand">${iconChevronDown('')}</button>
          </div>
        </div>
        <div class="order-body">
          ${order.type === 'online' ? onlineInfo(order) : ''}
          <table class="item-table">
            <thead>
              <tr>
                <th class="sl-col">Sl.No</th>
                <th>Saman</th>
                <th class="num-col">Qty</th>
                ${order.type === 'online' ? '' : '<th class="num-col">Price/Unit</th>'}
                <th class="num-col">Amount</th>
                <th class="chk-col">${iconCheck('icon-th')}</th>
              </tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
          </table>
          <div class="order-total-row">
            <span>Mila: ${checkedCount}/${items.length}</span>
            <span>Total: ₹${escHtml(Number(order.totalAmount || 0).toFixed(2))}</span>
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function showNewOrderAlert(order){
    const body = document.getElementById('staffAlertBody');
    const overlay = document.getElementById('staffAlertOverlay');
    const itemCount = Array.isArray(order.items) ? order.items.length : (order.totalItems || 0);
    body.innerHTML = `<b>${escHtml(order.custName || 'Customer')}</b> ke liye ${itemCount} item ki list aayi hai.<br>Total: ₹${escHtml(Number(order.totalAmount || 0).toFixed(2))}`;
    overlay.style.display = 'flex';

    try{ if(navigator.vibrate) navigator.vibrate([250,120,250,120,500]); }catch(e){}
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC){
        const ctx = new AC();
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = 880; g.gain.value = .05;
        o.connect(g); g.connect(ctx.destination); o.start();
        setTimeout(() => { try{ o.stop(); ctx.close(); }catch(e){} }, 420);
      }
    }catch(e){}

    const close = () => {
      overlay.style.display = 'none';
      expandedIds.add(order.id);
      const el = document.querySelector(`.order-card[data-id="${order.id}"]`);
      if(el) el.classList.add('expanded');
    };
    document.getElementById('staffAlertOkBtn').onclick = close;
    setTimeout(() => { if(overlay.style.display !== 'none') overlay.style.display = 'none'; }, 10000);
  }

  // ---------------- DAILY 4:30 AM CLEANUP ----------------
  // Roz subah 4:30 par purane saare orders delete (delivery partners ki registration '_partners' safe rehti hai).
  function lastCleanBoundary(){
    const d = new Date(); d.setHours(4, 30, 0, 0);
    if(d.getTime() > Date.now()) d.setDate(d.getDate() - 1);
    return d.getTime();
  }
  function dailyCleanup(){
    const b = lastCleanBoundary();
    const upd = {};
    Object.keys(latestOrders || {}).forEach(id => {
      if(id.charAt(0) === '_') return;
      const o = latestOrders[id] || {};
      if((o.ts || 0) < b) upd[id] = null;
    });
    if(Object.keys(upd).length) update(staffOrdersRef, upd).catch(err => console.warn('cleanup failed:', err));
  }
  setInterval(dailyCleanup, 60000);

  function startListening(){
    onValue(staffOrdersRef, (snapshot) => {
      const data = snapshot.val() || {};
      latestOrders = data;
      setTimeout(dailyCleanup, 1500);
      const ids = Object.keys(data).filter(id => id.charAt(0) !== '_');

      if(knownIds === null){
        // Pehli baar page khula — purane orders ke liye alert mat bajao,
        // sirf render karo.
        knownIds = new Set(ids);
        syncCompletionTimestamps(data);
        renderOrders(data);
        return;
      }

      const newIds = ids.filter(id => !knownIds.has(id));
      ids.forEach(id => knownIds.add(id));
      syncCompletionTimestamps(data);
      renderOrders(data);

      if(newIds.length){
        // Sabse naya order alert mein dikhega.
        const latest = newIds
          .map(id => Object.assign({ id }, data[id]))
          .sort((a, b) => (b.ts || 0) - (a.ts || 0))[0];
        showNewOrderAlert(latest);
      }
    }, (error) => {
      console.error('Firebase staffOrders listener failed:', error);
      // Isse ab error screen par bhi dikh jaayega, sirf console mein chupa
      // nahi rahega — pehle yehi wajah thi ki "Abhi tak koi order nahi aaya
      // hai…" hamesha dikhta rehta tha bina kisi wajah ke pata chale.
      if(emptyMsg){
        emptyMsg.dataset.err = '1';
        emptyMsg.textContent = 'Connection error: ' + (error && error.message ? error.message : error);
        ordersWrap.innerHTML = '';
        ordersWrap.appendChild(emptyMsg);
      }
    });
  }

  // Staff Display page ab tak Firebase se kabhi login (auth) nahi hota tha.
  // Mittu wale phone ka Google login hone ki wajah se uska "write" chal
  // jaata tha, lekin ye page bina login ke seedha data padhne ki koshish
  // karta tha — agar Firebase Database Rules mein login zaroori hai (jo
  // default setting hai), to iska "read" chup-chaap permission-denied ho
  // jaata tha aur order kabhi is screen par nahi aata tha. Yahan anonymous
  // login karke, aur listener ko login safal hone ke BAAD start karke, ye
  // theek kar rahe hain.
  onAuthStateChanged(fbAuth, (user) => {
    if(user) startListening();
  });


  // ---------------- ITEM PHOTOS (hamburger menu) ----------------
  (function(){
    const $ = id => document.getElementById(id);
    const drawer = $('menuDrawer'), ov = $('menuOverlay'), page = $('photosPage'), list = $('phList');
    let stock = {}, photos = {}, q = '', st = 'all', cat = '';
    function openMenu(){ drawer.classList.add('open'); ov.classList.add('show'); }
    function closeMenu(){ drawer.classList.remove('open'); ov.classList.remove('show'); }
    window.closeDrawer = closeMenu;
    $('menuBtn').addEventListener('click', openMenu);
    ov.addEventListener('click', closeMenu);
    $('menuPhotos').addEventListener('click', () => { closeMenu(); page.classList.add('show'); render(); });
    $('phBack').addEventListener('click', () => page.classList.remove('show'));
    $('phSearch').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); render(); });
    const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    function items(){
      const out = [];
      Object.keys(stock || {}).forEach(id => {
        const o = stock[id]; if(!o || !o.n) return;
        const vv = Array.isArray(o.v) ? o.v : Object.values(o.v || {});
        const units = vv.map(x => x && x.u).filter(Boolean);
        out.push({ id, name: String(o.n), unit: o.vl ? String(o.vl) : units.join(' / '), cat: String(o.c || 'Anya Saman').trim() || 'Anya Saman', img: (photos[id] && photos[id].u) || (typeof o.i === 'string' ? o.i : '') });
      });
      out.sort((a, b) => a.name.localeCompare(b.name));
      return out;
    }
    function render(){
      if(!page.classList.contains('show')) return;
      const base = items();
      if(cat && !base.some(it => it.cat === cat)) cat = '';
      const nImg = base.filter(it => it.img).length;
      $('phStatus').innerHTML = [['all','All (' + base.length + ')'],['has','Photo hai (' + nImg + ')'],['no','Photo nahi (' + (base.length - nImg) + ')']]
        .map(x => '<button type="button" data-st="' + x[0] + '"' + (st === x[0] ? ' class="on"' : '') + '>' + x[1] + '</button>').join('');
      const pool = base.filter(it => st === 'all' || (st === 'has') === !!it.img);
      const cats = {}; pool.forEach(it => { cats[it.cat] = (cats[it.cat] || 0) + 1; });
      $('phCats').innerHTML = Object.keys(cats).sort().map(c => '<button type="button" data-cat="' + esc(c) + '"' + (cat === c ? ' class="on"' : '') + '>' + esc(c) + ' (' + cats[c] + ')</button>').join('');
      const all = pool.filter(it => (!cat || it.cat === cat) && (!q || (it.name + ' ' + it.unit + ' ' + it.cat).toLowerCase().includes(q)));
      if(!all.length){ list.innerHTML = '<div style="padding:30px;text-align:center;color:#666">' + (Object.keys(stock || {}).length ? 'Kuch nahi mila' : 'Abhi shop par koi item publish nahi hua') + '</div>'; return; }
      list.innerHTML = all.map((it, i) => '<div class="ph-row" data-id="' + esc(it.id) + '"><div class="ph-top">'
        + (it.img ? '<img class="ph-img" src="' + esc(it.img) + '" alt="">' : '<div class="ph-img">🖼️</div>')
        + '<div style="min-width:0"><div class="ph-name">' + (i + 1) + '. ' + esc(it.name) + '</div><div class="ph-unit">' + (it.unit ? 'Unit: ' + esc(it.unit) : '') + '</div></div></div>'
        + '<div class="ph-btns"><button type="button" data-a="cam">📷 Camera</button><button type="button" data-a="gal">🖼️ Gallery</button><button type="button" data-a="web">🔍 Internet</button></div></div>').join('');
    }
    async function save(id, url){
      await set(ref(fbDb, 'itemPhotos/' + id), { u: url, ts: Date.now() });
    }
    $('phFilters').addEventListener('click', e => {
      const a = e.target.closest('button[data-st]'), c = e.target.closest('button[data-cat]');
      if(a) st = a.getAttribute('data-st');
      else if(c){ const v = c.getAttribute('data-cat'); cat = cat === v ? '' : v; }
      else return;
      render();
    });
    list.addEventListener('click', e => {
      const b = e.target.closest('button[data-a]'); if(!b) return;
      const row = b.closest('.ph-row'), id = row.getAttribute('data-id'), it = items().find(x => x.id === id); if(!it) return;
      const btns = row.querySelectorAll('button');
      const busy = on => btns.forEach(x => { x.disabled = on; });
      const done = async url => { try { await save(id, url); } catch(err){ alert('❌ Photo save nahi hui: ' + (err && err.message || err)); } };
      const a = b.getAttribute('data-a');
      if(a === 'web') return window.cldWebPick(it.name, done, busy);
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
      if(a === 'cam') inp.setAttribute('capture', 'environment');
      inp.onchange = async () => {
        const f = inp.files && inp.files[0]; if(!f) return;
        const blob = await window.cldCrop(f); if(!blob) return;
        busy(true);
        try { await done(await window.cldUpload(blob, true)); }
        catch(err){ alert('❌ ' + (err && err.message || 'Photo upload nahi hui')); }
        busy(false);
      };
      inp.click();
    });
    onAuthStateChanged(fbAuth, user => {
      window.currentFirebaseUser = user || null;
      if(!user) return;
      onValue(ref(fbDb, 'publicShop/stock'), s => { stock = s.val() || {}; render(); }, () => {});
      onValue(ref(fbDb, 'itemPhotos'), s => { photos = s.val() || {}; render(); }, () => {});
    });
  })();

  signInAnonymously(fbAuth).catch(err => {
    console.error('Anonymous sign-in failed:', err);
    if(emptyMsg){
      emptyMsg.textContent = 'Login error: ' + (err && err.message ? err.message : err) + '. Firebase console mein Authentication > Sign-in method mein "Anonymous" ON karein.';
    }
  });

  // Display chalu rahe: screen band na ho
  (async function keepAwake(){
    try{ if('wakeLock' in navigator){ let l = await navigator.wakeLock.request('screen'); document.addEventListener('visibilitychange', async () => { if(document.visibilityState === 'visible'){ try{ l = await navigator.wakeLock.request('screen'); }catch(e){} } }); } }catch(e){}
  })();
</script>
<script id="backguard">
/* BACKGUARD: Android side-swipe / back button se sirf ek screen peeche jaye, poora app band na ho. */
(function(){
  if(window.__backGuard) return; window.__backGuard = 1;
  var SKIP = {loginScreen:1, setPasswordOverlay:1, rtOnb:1};
  function vis(el){
    if(!el) return false;
    var r = el.getBoundingClientRect(); if(r.width < 2 || r.height < 2) return false;
    var cs = getComputedStyle(el);
    return cs.display !== 'none' && cs.visibility !== 'hidden' && cs.opacity !== '0';
  }
  function zi(el){ var z = parseInt(getComputedStyle(el).zIndex, 10); return isNaN(z) ? 0 : z; }
  var SEL = '[id$="Overlay"],[id$="Modal"],[id$="Sheet"],[id$="Screen"],[id$="Viewer"],[id$="Popup"],[id$="Dialog"],.page.show,.modal.show,#donePage.show,#drawerPanel.open,#photosPage.show,#menuDrawer.open';
  var BTN = '[data-back],[data-close],.close,.back,[aria-label*="ack" i],[aria-label*="lose" i],[id*="Back" i],[id*="Close" i],[id*="Cancel" i],[onclick*="close" i],[onclick*="hide" i],[onclick*="back" i],.stock-modal-cancel,.ph button';
  function closeEl(el){
    if((el.id === 'drawerPanel' || el.id === 'menuDrawer') && typeof window.closeDrawer === 'function'){ window.closeDrawer(); return true; }
    if(el.id === 'photosPage'){ document.getElementById('phBack').click(); return true; }
    var b = el.querySelector(BTN);
    if(b){ try{ b.click(); }catch(e){} }
    setTimeout(function(){
      if(vis(el) && getComputedStyle(el).position !== 'static'){
        el.classList.remove('show','open','active'); el.style.display = 'none';
      }
    }, 150);
    return true;
  }
  function closeTop(){
    if(typeof window.__bgExtra === 'function'){ try{ if(window.__bgExtra()) return true; }catch(e){} }
    var best = null, bz = -1e9, bi = -1;
    var list = document.querySelectorAll(SEL);
    for(var i = 0; i < list.length; i++){
      var el = list[i];
      if(SKIP[el.id] || !vis(el)) continue;
      if(el.id === 'drawerOverlay') continue;
      var pos = getComputedStyle(el).position;
      if(pos !== 'fixed' && pos !== 'absolute') continue;
      var z = zi(el);
      if(z >= bz){ bz = z; best = el; bi = i; }
    }
    if(best) return closeEl(best);
    if(typeof window.__bgHome === 'function'){ try{ if(window.__bgHome()) return true; }catch(e){} }
    return false;
  }
  var exitArmed = false;
  function exitToast(){
    if(!document.body) return;
    toast('App band karne ke liye dobara back dabayein');
  }
  function toast(t){
    var d = document.createElement('div');
    d.textContent = t;
    d.style.cssText = 'position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:10px 16px;border-radius:20px;font:600 13px sans-serif;z-index:2147483647;pointer-events:none';
    document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 1800);
  }
  /* 1) Native (Capacitor App plugin) - sabse pakka tareeka */
  var nativeOn = false;
  function tryNative(){
    if(nativeOn) return true;
    var A = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
    if(!A || typeof A.addListener !== 'function') return false;
    nativeOn = true;
    A.addListener('backButton', function(){
      if(closeTop()) return;
      if(exitArmed){ try{ A.exitApp(); }catch(e){} return; }
      exitArmed = true; exitToast(); setTimeout(function(){ exitArmed = false; }, 1800);
    });
    return true;
  }
  /* 2) Fallback: browser history (user touch ke baad hi push - warna Android WebView use skip kar deta hai) */
  var armedOnce = false;
  function arm(){ try{ history.pushState({bg: 1}, ''); }catch(e){} }
  function firstTouch(){
    if(armedOnce || nativeOn) return; armedOnce = true;
    try{ history.replaceState({bg: 0}, ''); }catch(e){}
    arm();
  }
  ['touchstart', 'pointerdown', 'click', 'keydown'].forEach(function(ev){ window.addEventListener(ev, firstTouch, {capture: true, once: true, passive: true}); });
  window.addEventListener('popstate', function(){
    if(nativeOn) return;
    if(closeTop()){ arm(); return; }
    if(!exitArmed){
      exitArmed = true; exitToast();
      setTimeout(function(){ exitArmed = false; arm(); }, 1800);
    }
  });
  if(!tryNative()){ var n = 0, iv = setInterval(function(){ if(tryNative() || ++n > 10) clearInterval(iv); }, 500); }
})();

/* Bahari links (Google Maps, WhatsApp, tel) APK ke WebView mein kaam karein */
(function(){
  if(window.__extLinks) return; window.__extLinks = 1;
  document.addEventListener('click', function(e){
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null; if(!a) return;
    var h = a.getAttribute('href') || '';
    if(!/^https?:/i.test(h)) return;
    var u; try{ u = new URL(h, location.href); }catch(x){ return; }
    if(a.target === '_blank' || u.origin !== location.origin){
      e.preventDefault();
      var w = null; try{ w = window.open(h, '_blank'); }catch(x){}
      if(!w){ try{ location.href = h; }catch(x){} }
    }
  }, true);
})();
