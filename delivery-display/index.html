<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mittu Delivery</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a237e">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#eef1fb;color:#1b1f3b;min-height:100vh;padding-bottom:40px}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#1a237e,#3949ab);color:#fff;padding:14px 16px;box-shadow:0 3px 14px rgba(26,35,126,.4)}
  .h-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .h-title{font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px}
  .h-me{font-size:12px;opacity:.9;text-align:right}
  .h-me button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:8px;padding:4px 8px;font-size:11px;margin-left:6px}
  .tabs{display:flex;gap:8px;margin-top:10px}
  .tab{flex:1;padding:9px 6px;border:0;border-radius:10px;background:rgba(255,255,255,.16);color:#fff;font-weight:700;font-size:14px}
  .tab.on{background:#fff;color:#1a237e}
  .tab b{background:#ff5252;color:#fff;border-radius:10px;padding:0 7px;margin-left:5px;font-size:12px}
  #wrap{max-width:560px;margin:14px auto;padding:0 12px;display:flex;flex-direction:column;gap:14px}
  .empty{text-align:center;color:#5b6290;padding:60px 20px;font-weight:600}
  .card{background:#fff;border-radius:16px;box-shadow:0 4px 16px rgba(26,35,126,.12);overflow:hidden;border-left:6px solid #3949ab}
  .card.out{border-left-color:#ff9800}.card.delivered{border-left-color:#2e9d57;opacity:.92}
  .c-top{padding:14px 14px 6px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .c-name{font-size:18px;font-weight:800}
  .c-id{font-size:12px;color:#6b72a8;margin-top:2px}
  .badge{font-size:11.5px;font-weight:800;border-radius:8px;padding:3px 8px;white-space:nowrap}
  .b-new{background:#e8eaf6;color:#1a237e}.b-out{background:#fff3e0;color:#e65100}.b-done{background:#e6f4ea;color:#137333}
  .c-addr{padding:2px 14px 8px;font-size:15px;line-height:1.45}
  .pay{margin:4px 14px 8px;padding:10px 12px;border-radius:12px;font-weight:800;font-size:15px}
  .pay.cod{background:#fff4d6;color:#7a4b00;border:1.5px solid #ffc94d}
  .pay.paid{background:#e6f4ea;color:#137333;border:1.5px solid #9fd8b2}
  .ready{padding:0 14px 6px;font-size:13px;color:#4a5190;font-weight:700}
  .rdy-ok{margin:0 14px 6px;padding:10px 12px;border-radius:12px;background:#e6f4ea;color:#137333;font-weight:800;font-size:15px;border:1.5px solid #9fd8b2}
  .bar{height:7px;border-radius:5px;background:#e3e6f6;margin:5px 0 2px;overflow:hidden}.bar i{display:block;height:100%;background:#2e9d57}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 14px}
  .acts a,.acts button{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 6px;border-radius:12px;border:0;font-weight:800;font-size:14px;text-decoration:none;color:#fff}
  .a-map{background:#1a73e8;grid-column:1/3;font-size:16px !important;padding:14px 6px !important}
  .a-call{background:#0d6e4e}.a-wa{background:#25a244}
  .a-go{background:#ff9800;grid-column:1/3}.a-done{background:#2e9d57;grid-column:1/3;font-size:16px !important;padding:14px 6px !important}
  .dist{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:2px 14px 8px}
  .dchip{border:1.5px solid #3949ab;background:#eef0fb;color:#1a237e;border-radius:12px;padding:9px 6px;font-weight:700;font-size:13px;line-height:1.3;text-align:center}
  .dchip b{display:block;font-size:17px;color:#0d47a1}
  .dchip.na b{font-size:13px;color:#8a8fb5}
  #dOptOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:flex-end;justify-content:center}
  #dOptOverlay .sheet{width:100%;max-width:480px;background:#fff;border-radius:20px 20px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px))}
  #dOptOverlay h3{margin:0 0 4px;font-size:17px}#dOptOverlay p{margin:0 0 12px;color:#667;font-size:13px}
  .obtn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:15px;margin-top:8px;color:#fff}
  .o-app{background:#3949ab}.o-g{background:#1a73e8}.o-x{background:#eceefa;color:#333}
  #dMapOverlay{display:none;position:fixed;inset:0;background:#fff;z-index:310;flex-direction:column}
  #dMapOverlay .mh{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#1a237e,#3949ab);color:#fff;padding:calc(14px + max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px))) 14px 12px}
  #dMapOverlay .mh button{background:none;border:0;color:#fff;font-size:26px;line-height:1}
  #dMapOverlay .mh div{font-weight:800;font-size:15px}
  #dMap{flex:1;min-height:0}
  #dMapOverlay .mf{padding:10px 14px calc(16px + env(safe-area-inset-bottom,0px));background:#fff}
  details{padding:0 14px 12px}summary{font-weight:700;color:#3949ab;padding:6px 0;cursor:pointer}
  table{width:100%;border-collapse:collapse;font-size:13.5px}td{padding:6px 3px;border-bottom:1px solid #eceefa}td.r{text-align:right;white-space:nowrap}
  tr.chk td{color:#2e9d57}
  #login{position:fixed;inset:0;background:linear-gradient(160deg,#1a237e,#3949ab);display:flex;align-items:center;justify-content:center;padding:22px;z-index:100}
  .lbox{background:#fff;border-radius:20px;padding:26px 20px;width:min(94vw,380px);text-align:center}
  .lbox h2{margin:0 0 6px;color:#1a237e}.lbox p{color:#555;font-size:14px;margin:0 0 14px}
  .lbox input{width:100%;padding:14px;border:2px solid #c5cae9;border-radius:12px;font-size:18px;text-align:center;letter-spacing:1px}
  .lbox button{margin-top:14px;width:100%;padding:14px;border:0;border-radius:12px;background:#1a237e;color:#fff;font-size:16px;font-weight:800}
  #lerr{color:#b3261e;font-size:13px;margin-top:8px;min-height:16px}
  #alert{position:fixed;left:12px;right:12px;top:12px;z-index:200;background:#1a237e;color:#fff;border-radius:14px;padding:14px;font-weight:700;display:none;box-shadow:0 8px 30px rgba(0,0,0,.35)}
</style>
<style id="sat-fix">
header{padding-top:calc(14px + max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px))) !important}
#alert{top:calc(12px + max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px))) !important}
#login{padding-top:calc(22px + max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px))) !important}
</style>
</head>
<body>
<div id="login"><div class="lbox">
  <h2>🛵 Mittu Delivery</h2>
  <p>Apna naam aur mobile number likhein — sirf aapko diye gaye orders yahan dikhenge.</p>
  <input id="lnm" placeholder="Aapka naam" maxlength="40" style="margin-bottom:10px;letter-spacing:0">
  <input id="lph" type="tel" inputmode="numeric" maxlength="10" placeholder="10 digit mobile">
  <div id="lerr"></div>
  <button id="lgo">Shuru karein</button>
</div></div>
<div id="alert"></div>
<header>
  <div class="h-row"><div class="h-title">🛵 Mittu Delivery</div><div class="h-me"><span id="me"></span><button id="chg">Number badlein</button></div></div>
  <div class="tabs"><button class="tab on" data-t="p">Baaki <b id="cp">0</b></button><button class="tab" data-t="d">Ho gaye</button></div>
</header>
<div id="wrap"><div class="empty" id="empty">Orders load ho rahe hain…</div></div>

<div id="dOptOverlay"><div class="sheet"><h3 id="dOptTitle"></h3><p id="dOptSub"></p>
  <button type="button" class="obtn o-app" id="dOptApp">🗺️ App mein map kholen</button>
  <button type="button" class="obtn o-g" id="dOptG">🧭 Google Map app kholen</button>
  <button type="button" class="obtn o-x" id="dOptClose">Band karein</button></div></div>
<div id="dMapOverlay"><div class="mh"><button type="button" id="dMapClose" aria-label="Back">←</button><div id="dMapTitle"></div></div><div id="dMap"></div>
  <div class="mf"><button type="button" class="obtn o-g" id="dMapG" style="margin:0">🧭 Google Map app mein kholen</button></div></div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  const cfg = {
    apiKey: "AIzaSyDQ-fm6-_bs728n6rcUS-XS9Zl-hqbIQhA",
    authDomain: "mittu-billing.firebaseapp.com",
    databaseURL: "https://mittu-billing-default-rtdb.firebaseio.com",
    projectId: "mittu-billing",
    storageBucket: "mittu-billing.firebasestorage.app",
    messagingSenderId: "9778174452",
    appId: "1:9778174452:web:99b40c599546a5560541a1"
  };
  const app = initializeApp(cfg), db = getDatabase(app), auth = getAuth(app);
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const get = k => { try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } };
  const set = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };
  let myLoc = null, lastRender = 0;
  let myName = get('mittu_dp_name'), me = get('mittu_dp_phone'), tab = 'p', dataA = {}, dataB = {}, data = {}, known = null, started = false, unsubB = null;

  function showLogin(){ $('login').style.display = 'flex'; $('lph').value = me; $('lnm').value = myName; }
  $('lgo').onclick = () => {
    const v = $('lph').value.replace(/\D/g,'').slice(-10), nm = $('lnm').value.trim();
    if(nm.length < 2){ $('lerr').textContent = 'Apna naam likhein.'; return; }
    if(!/^[6-9]\d{9}$/.test(v)){ $('lerr').textContent = 'Sahi 10 digit mobile number likhein.'; return; }
    me = v; myName = nm; set('mittu_dp_phone', v); set('mittu_dp_name', nm); register(); $('login').style.display = 'none'; known = null; init(); listenJobs(); render();
  };
  $('chg').onclick = showLogin;
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.t; document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b)); render(); });


  // ---------- LOCATION + DOORI ----------
  function startGeo(){
    if(!navigator.geolocation || window.__geoOn) return; window.__geoOn = true;
    try { navigator.geolocation.watchPosition(p => {
      myLoc = { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy || 0) };
      const moved = !window.__lastRL || hav(window.__lastRL, myLoc) > 0.04;
      if(moved && Date.now() - lastRender > 8000 && !document.querySelector('details[open]') && !$('dMapOverlay').style.display.includes('flex')){ lastRender = Date.now(); window.__lastRL = { lat: myLoc.lat, lng: myLoc.lng }; render(); }
    }, () => {}, { enableHighAccuracy: true, maximumAge: 10000, timeout: 30000 }); } catch(e){}
  }
  function hav(a, b){
    const R = 6371, rad = x => x * Math.PI / 180, dLa = rad(b.lat - a.lat), dLn = rad(b.lng - a.lng);
    const h = Math.sin(dLa/2)**2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLn/2)**2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  const fmtD = km => km < 1 ? '~' + Math.round(km * 1000 / 10) * 10 + ' m' : '~' + km.toFixed(1) + ' km';
  const shopOf = o => { const l = o.shopLoc || o.shop; return (l && Number(l.lat) && Number(l.lng)) ? { lat: Number(l.lat), lng: Number(l.lng), name: l.name || (o.shop && o.shop.name) || 'Dukaan' } : null; };
  const custOf = o => (Number(o.lat) && Number(o.lng)) ? { lat: Number(o.lat), lng: Number(o.lng) } : null;
  function legs(o){
    const sh = shopOf(o), cu = custOf(o), st = dstat(o);
    const pk = (myLoc && sh) ? hav(myLoc, sh) : null;
    const from = st === 'out' ? (myLoc || sh) : (sh || myLoc);
    const dr = (from && cu) ? hav(from, cu) : null;
    return { sh, cu, pk, dr };
  }
  const gUrl = (pt, o) => 'https://www.google.com/maps/dir/?api=1' + (myLoc ? '&origin=' + myLoc.lat + ',' + myLoc.lng : '') + '&destination=' + (pt ? pt.lat + ',' + pt.lng : encodeURIComponent(o.address || '')) + '&travelmode=driving';
  let curOpt = null;
  window.__dopt = (id, kind) => {
    const o = data[id]; if(!o) return; const L = legs(o), pt = kind === 'p' ? L.sh : L.cu;
    if(!pt && kind === 'p'){ alert('Dukaan ne abhi apni GPS location save nahi ki hai. Dukaan se poochein ya address dekhein.'); return; }
    curOpt = { id, kind, pt, o };
    $('dOptTitle').textContent = kind === 'p' ? '🏬 Pickup: ' + ((pt && pt.name) || 'Dukaan') : '🏠 Drop: ' + (o.custName || 'Customer');
    $('dOptSub').textContent = (kind === 'p' ? (L.pk != null ? 'Aapse ' + fmtD(L.pk) + ' door (seedhi doori)' : 'Aapki location abhi nahi mili') : (L.dr != null ? fmtD(L.dr) + ' (seedhi doori)' : 'Customer ki GPS location nahi hai')) ;
    $('dOptOverlay').style.display = 'flex';
  };
  $('dOptClose').onclick = () => { $('dOptOverlay').style.display = 'none'; };
  $('dOptG').onclick = () => { if(!curOpt) return; $('dOptOverlay').style.display = 'none'; window.open(gUrl(curOpt.pt, curOpt.o), '_blank'); };
  $('dOptApp').onclick = () => { if(!curOpt) return; $('dOptOverlay').style.display = 'none'; openMap(curOpt); };
  $('dMapG').onclick = () => { if(curOpt) window.open(gUrl(curOpt.pt, curOpt.o), '_blank'); };
  $('dMapClose').onclick = () => { $('dMapOverlay').style.display = 'none'; render(); };

  // ---------- Leaflet + OpenStreetMap ----------
  let MAP = null, MLAY = null;
  function loadScriptT(src, ms){ return new Promise((ok, no) => { const sc = document.createElement('script'); let d = 0; const f = (fn, v) => { if(d) return; d = 1; fn(v); }; sc.onload = () => f(ok); sc.onerror = () => f(no, new Error('x')); setTimeout(() => f(no, new Error('timeout')), ms); sc.src = src; document.head.appendChild(sc); }); }
  async function loadLeaflet(){
    if(window.L) return;
    for(const b of ['https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/', 'https://unpkg.com/leaflet@1.9.4/dist/', 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/']){
      try { const l = document.createElement('link'); l.rel = 'stylesheet'; const cd = b.includes('cdnjs'); l.href = b + (cd ? 'leaflet.min.css' : 'leaflet.css'); document.head.appendChild(l); await loadScriptT(b + (cd ? 'leaflet.min.js' : 'leaflet.js'), 7000); if(window.L) return; } catch(e){}
    }
    throw new Error('map');
  }
  const emo = (e, bg) => L.divIcon({ className: '', html: '<div style="font-size:22px;background:' + bg + ';border:2px solid #fff;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.4)">' + e + '</div>', iconSize: [34, 34], iconAnchor: [17, 17] });
  async function openMap(c){
    $('dMapOverlay').style.display = 'flex';
    const Lg = legs(c.o), ttl = c.kind === 'p' ? '🏬 Pickup' + (Lg.pk != null ? ' · ' + fmtD(Lg.pk) : '') : '🏠 Drop' + (Lg.dr != null ? ' · ' + fmtD(Lg.dr) : '');
    $('dMapTitle').textContent = ttl;
    try { await loadLeaflet(); } catch(e){ $('dMap').innerHTML = '<div class="empty">Map load nahi hua. Internet check karein ya Google Map app wala button dabayein.</div>'; return; }
    if(!MAP){ MAP = L.map('dMap', { zoomControl: true }); L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(MAP); }
    if(MLAY){ MAP.removeLayer(MLAY); }
    const pts = [], g = [];
    if(myLoc){ pts.push([myLoc.lat, myLoc.lng]); g.push(L.circleMarker([myLoc.lat, myLoc.lng], { radius: 8, color: '#fff', weight: 3, fillColor: '#1a73e8', fillOpacity: 1 }).bindTooltip('Aap', { permanent: true, direction: 'top', offset: [0, -8] })); }
    if(Lg.sh){ pts.push([Lg.sh.lat, Lg.sh.lng]); g.push(L.marker([Lg.sh.lat, Lg.sh.lng], { icon: emo('🏬', '#fff3e0') }).bindTooltip('Pickup: ' + Lg.sh.name, { permanent: c.kind === 'p', direction: 'top', offset: [0, -16] })); }
    if(Lg.cu){ pts.push([Lg.cu.lat, Lg.cu.lng]); g.push(L.marker([Lg.cu.lat, Lg.cu.lng], { icon: emo('🏠', '#e6f4ea') }).bindTooltip('Drop: ' + (c.o.custName || 'Customer'), { permanent: c.kind === 'd', direction: 'top', offset: [0, -16] })); }
    const route = [myLoc, Lg.sh, Lg.cu].filter(Boolean).map(p => [p.lat, p.lng]);
    if(route.length > 1) g.push(L.polyline(route, { color: '#3949ab', weight: 4, dashArray: '8 8' }));
    MLAY = L.layerGroup(g).addTo(MAP);
    setTimeout(() => { MAP.invalidateSize(); if(pts.length > 1) MAP.fitBounds(pts, { padding: [50, 50], maxZoom: 17 }); else if(pts.length) MAP.setView(pts[0], 16); else MAP.setView([25.0, 87.0], 12); }, 200);
  }

  function register(){
    if(!me || !myName || !auth.currentUser) return;
    update(ref(db, 'staffOrders/_partners/' + me), { name: myName, phone: me, ts: Date.now() }).catch(e => console.warn('register failed', e));
  }
  function merge(){
    data = {};
    Object.keys(dataA).forEach(k => { if(k.charAt(0) !== '_' && mine(dataA[k])) data['s_' + k] = Object.assign({}, dataA[k], { _src: 's', _key: k }); });
    Object.keys(dataB).forEach(k => { const o = dataB[k]; if(o && o.type === 'online') data['j_' + k] = Object.assign({}, o, { _src: 'j', _key: k }); });
  }
  const mine = o => o && o.type === 'online' && o.deliveryPartner && String(o.deliveryPartner.phone || '').replace(/\D/g,'').slice(-10) === me;
  const dstat = o => o.deliveryStatus || 'new';

  function setStatus(id, st){
    const u = { deliveryStatus: st };
    u[st === 'out' ? 'pickedTs' : 'deliveredTs'] = Date.now();
    const o = data[id] || {};
    update(ref(db, (o._src === 'j' ? 'deliveryJobs/' + me + '/' : 'staffOrders/') + (o._key || id)), u).catch(e => alert('Update nahi ho paya: ' + (e && e.message || e)));
  }
  window.__go = id => setStatus(id, 'out');
  window.__done = id => { if(confirm('Pakka deliver ho gaya?')) setStatus(id, 'delivered'); };

  function card(o){
    const items = Array.isArray(o.items) ? o.items : [];
    const chk = o.checked || {}, n = items.filter((_, i) => chk[i]).length, pct = items.length ? Math.round(n * 100 / items.length) : 0;
    const allReady = !o.noChecklist && items.length > 0 && n === items.length;
    const st = dstat(o), ph = String(o.custMobile || '').replace(/\D/g,'');
    const total = Number(o.totalAmount || 0).toFixed(2);
    const pay = o.pay === 'ONLINE' ? `<div class="pay paid">💳 Online paid — paisa lena nahi hai</div>` : `<div class="pay cod">💵 Customer se ₹${total} lena hai${o.pay === 'UPI' ? ' (UPI se bhi de sakta hai)' : ' (Cash)'}</div>`;
    const badge = st === 'delivered' ? '<span class="badge b-done">✅ Deliver ho gaya</span>' : st === 'out' ? '<span class="badge b-out">🛵 Raaste mein</span>' : '<span class="badge b-new">🆕 Naya</span>';
    const map = o.mapUrl || ('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(o.address || ''));
    let btns = `<a class="a-map" href="${esc(map)}" target="_blank" rel="noopener">📍 Google Map mein kholein${o.lat ? (o.pin ? ' (📌 Customer ka pin)' : ' (GPS' + (Number(o.acc) ? ' ±' + Math.round(o.acc) + ' m' : '') + ')') : ''}</a>`;
    if(ph) btns += `<a class="a-call" href="tel:${esc(ph)}">📞 Call</a><a class="a-wa" href="https://wa.me/91${esc(ph)}" target="_blank" rel="noopener">WhatsApp</a>`;
    if(st === 'new') btns += `<button class="a-go" onclick="__go('${esc(o.id)}')">🛵 Saman le liya — Nikal gaya</button>`;
    if(st !== 'delivered') btns += `<button class="a-done" onclick="__done('${esc(o.id)}')">✅ Deliver ho gaya</button>`;
    return `<div class="card ${st}">
      <div class="c-top"><div><div class="c-name">${esc(o.custName || 'Customer')}</div><div class="c-id">${esc(o.orderId || '')} · ${items.length} item · ₹${total}</div></div>${badge}</div>
      <div class="c-addr">📍 ${esc(o.address || 'Pata nahi diya')}</div>
      ${(() => { const L = legs(o); const pk = L.pk != null ? `<b>${fmtD(L.pk)}</b>` : `<b>${myLoc ? 'Dukaan location nahi' : 'Location on karein'}</b>`; const dr = L.dr != null ? `<b>${fmtD(L.dr)}</b>` : `<b>${L.cu ? 'Location on karein' : 'GPS nahi hai'}</b>`; return `<div class="dist"><button type="button" class="dchip ${L.pk != null ? '' : 'na'}" onclick="__dopt('${esc(o.id)}','p')">🏬 Pickup distance${pk}</button><button type="button" class="dchip ${L.dr != null ? '' : 'na'}" onclick="__dopt('${esc(o.id)}','d')">🏠 Drop distance${dr}</button></div>`; })()}
      ${pay}
      ${o.noChecklist ? `<div class="rdy-ok">🏬 ${esc((o.shop && o.shop.name) || 'Dukaan')} se saman lein${o.shop && o.shop.phone ? ' · <a href="tel:' + esc(o.shop.phone) + '" style="color:#137333">📞 ' + esc(o.shop.phone) + '</a>' : ''}</div>` : allReady ? '<div class="rdy-ok">✅ SAMAN READY — le ja sakte hain</div>' : `<div class="ready">⏳ Saman taiyaar ho raha hai: ${n}/${items.length}<div class="bar"><i style="width:${pct}%"></i></div></div>`}
      <div class="acts">${btns}</div>
      <details><summary>Saman ki list</summary><table>${items.map((it,i) => `<tr class="${chk[i] ? 'chk' : ''}"><td>${chk[i] ? '✔' : '•'} ${esc(it.name)}</td><td class="r">${esc(it.qty)} ${esc(it.unit || '')}</td></tr>`).join('')}</table></details>
    </div>`;
  }

  function render(){
    $('me').textContent = me ? '👤 ' + (myName ? myName + ' · ' : '') + me : '';
    const all = Object.keys(data).map(id => Object.assign({ id }, data[id])).sort((a,b) => (b.ts||0) - (a.ts||0));
    const pend = all.filter(o => dstat(o) !== 'delivered'), done = all.filter(o => dstat(o) === 'delivered');
    $('cp').textContent = pend.length;
    const list = tab === 'p' ? pend : done;
    $('wrap').innerHTML = list.length ? list.map(card).join('') : `<div class="empty">${tab === 'p' ? 'Abhi koi delivery baaki nahi hai 🎉' : 'Abhi koi delivery complete nahi hui.'}</div>`;
  }

  let readySet = null;
  function checkReady(){
    const ids = Object.keys(data).filter(id => !data[id].noChecklist && dstat(data[id]) === 'new' && Array.isArray(data[id].items) && data[id].items.length && data[id].items.every((_, i) => (data[id].checked || {})[i]));
    if(readySet === null){ readySet = new Set(ids); return; }
    const fresh = ids.filter(id => !readySet.has(id)); ids.forEach(id => readySet.add(id));
    if(fresh.length) notify(data[fresh[0]], true);
  }
  function notify(o, ready){
    const a = $('alert'); a.innerHTML = ready ? ('✅ Saman READY: <b>' + esc(o.custName || 'Customer') + '</b> — le jaane ke liye taiyaar') : ('🆕 Nayi delivery: <b>' + esc(o.custName || 'Customer') + '</b> — ₹' + esc(Number(o.totalAmount||0).toFixed(2))); a.style.display = 'block';
    try { if(navigator.vibrate) navigator.vibrate([250,120,250,120,500]); } catch(e){}
    try { const AC = window.AudioContext || window.webkitAudioContext; if(AC){ const c = new AC(), os = c.createOscillator(), g = c.createGain(); os.frequency.value = 880; g.gain.value = .05; os.connect(g); g.connect(c.destination); os.start(); setTimeout(() => { try{ os.stop(); c.close(); }catch(e){} }, 450); } } catch(e){}
    setTimeout(() => a.style.display = 'none', 7000);
  }

  const T0 = Date.now();
  function onData(){
    const ids = Object.keys(data);
    if(known === null){ known = new Set(ids); }
    else { const fresh = ids.filter(id => !known.has(id)); ids.forEach(id => known.add(id)); if(fresh.length && Date.now() - T0 > 4000) notify(data[fresh[0]]); }
    checkReady();
    render();
  }
  function listenJobs(){
    if(unsubB){ try { unsubB(); } catch(e){} unsubB = null; }
    if(!me) return;
    unsubB = onValue(ref(db, 'deliveryJobs/' + me), snap => { dataB = snap.val() || {}; merge(); onData(); }, () => {});
  }
  function listen(){
    onValue(ref(db, 'staffOrders'), snap => { dataA = snap.val() || {}; merge(); onData(); }, err => { $('wrap').innerHTML = '<div class="empty">Connection error: ' + esc(err && err.message || err) + '</div>'; });
    listenJobs();
  }
  function init(){ if(started) return; started = true; onAuthStateChanged(auth, u => { if(u){ register(); listen(); } }); signInAnonymously(auth).catch(e => { $('wrap').innerHTML = '<div class="empty">Login error: ' + esc(e && e.message || e) + '</div>'; }); }

  startGeo();
  if(me){ $('login').style.display = 'none'; init(); } else showLogin();
  (async () => { try { if('wakeLock' in navigator){ let l = await navigator.wakeLock.request('screen'); document.addEventListener('visibilitychange', async () => { if(document.visibilityState === 'visible'){ try{ l = await navigator.wakeLock.request('screen'); }catch(e){} } }); } } catch(e){} })();
</script>
<script id="backguard">
/* BACKGUARD: Android side-swipe / back button se sirf ek screen peeche jaye, poora app band na ho. */
(function(){
  if(window.__backGuard) return; window.__backGuard = 1;
  var SKIP = {loginScreen:1, setPasswordOverlay:1, rtOnb:1};
  function vis(el){
    if(!el) return false;
    var r = el.getBoundingClientRect(); if(r.width < 2 || r.height < 2) return false;
    var cs = getComputedStyle(el);
    return cs.display !== 'none' && cs.visibility !== 'hidden' && cs.opacity !== '0';
  }
  function zi(el){ var z = parseInt(getComputedStyle(el).zIndex, 10); return isNaN(z) ? 0 : z; }
  var SEL = '[id$="Overlay"],[id$="Modal"],[id$="Sheet"],[id$="Screen"],[id$="Viewer"],[id$="Popup"],[id$="Dialog"],.page.show,.modal.show,#donePage.show,#drawerPanel.open';
  var BTN = '[data-back],[data-close],.close,.back,[aria-label*="ack" i],[aria-label*="lose" i],[id*="Back" i],[id*="Close" i],[id*="Cancel" i],[onclick*="close" i],[onclick*="hide" i],[onclick*="back" i],.stock-modal-cancel,.ph button';
  function closeEl(el){
    if(el.id === 'drawerPanel' && typeof window.closeDrawer === 'function'){ window.closeDrawer(); return true; }
    var b = el.querySelector(BTN);
    if(b){ try{ b.click(); }catch(e){} }
    setTimeout(function(){
      if(vis(el) && getComputedStyle(el).position !== 'static'){
        el.classList.remove('show','open','active'); el.style.display = 'none';
      }
    }, 150);
    return true;
  }
  function closeTop(){
    if(typeof window.__bgExtra === 'function'){ try{ if(window.__bgExtra()) return true; }catch(e){} }
    var best = null, bz = -1e9, bi = -1;
    var list = document.querySelectorAll(SEL);
    for(var i = 0; i < list.length; i++){
      var el = list[i];
      if(SKIP[el.id] || !vis(el)) continue;
      if(el.id === 'drawerOverlay') continue;
      var pos = getComputedStyle(el).position;
      if(pos !== 'fixed' && pos !== 'absolute') continue;
      var z = zi(el);
      if(z >= bz){ bz = z; best = el; bi = i; }
    }
    if(best) return closeEl(best);
    if(typeof window.__bgHome === 'function'){ try{ if(window.__bgHome()) return true; }catch(e){} }
    return false;
  }
  var exitArmed = false;
  function exitToast(){
    if(!document.body) return;
    toast('App band karne ke liye dobara back dabayein');
  }
  function toast(t){
    var d = document.createElement('div');
    d.textContent = t;
    d.style.cssText = 'position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:10px 16px;border-radius:20px;font:600 13px sans-serif;z-index:2147483647;pointer-events:none';
    document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 1800);
  }
  /* 1) Native (Capacitor App plugin) - sabse pakka tareeka */
  var nativeOn = false;
  function tryNative(){
    if(nativeOn) return true;
    var A = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
    if(!A || typeof A.addListener !== 'function') return false;
    nativeOn = true;
    A.addListener('backButton', function(){
      if(closeTop()) return;
      if(exitArmed){ try{ A.exitApp(); }catch(e){} return; }
      exitArmed = true; exitToast(); setTimeout(function(){ exitArmed = false; }, 1800);
    });
    return true;
  }
  /* 2) Fallback: browser history (user touch ke baad hi push - warna Android WebView use skip kar deta hai) */
  var armedOnce = false;
  function arm(){ try{ history.pushState({bg: 1}, ''); }catch(e){} }
  function firstTouch(){
    if(armedOnce || nativeOn) return; armedOnce = true;
    try{ history.replaceState({bg: 0}, ''); }catch(e){}
    arm();
  }
  ['touchstart', 'pointerdown', 'click', 'keydown'].forEach(function(ev){ window.addEventListener(ev, firstTouch, {capture: true, once: true, passive: true}); });
  window.addEventListener('popstate', function(){
    if(nativeOn) return;
    if(closeTop()){ arm(); return; }
    if(!exitArmed){
      exitArmed = true; exitToast();
      setTimeout(function(){ exitArmed = false; arm(); }, 1800);
    }
  });
  if(!tryNative()){ var n = 0, iv = setInterval(function(){ if(tryNative() || ++n > 10) clearInterval(iv); }, 500); }
})();
</script>
