<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline</title>
<style>
  html,body{margin:0;height:100%;background:#f4f5fb;font-family:system-ui,-apple-system,Roboto,sans-serif;color:#1d2433}
  .w{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center}
  svg{width:150px;height:auto;margin-bottom:18px}
  h1{font-size:22px;margin:0 0 8px}
  p{margin:0 0 22px;color:#5b6477;font-size:15px;line-height:1.5;max-width:300px}
  button{border:0;background:#1a56c4;color:#fff;font-weight:700;font-size:16px;padding:13px 30px;border-radius:26px}
  .s{margin-top:14px;font-size:13px;color:#8a93a6;min-height:18px}
  .pulse{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.35}}
</style></head><body>
<div class="w">
  <svg viewBox="0 0 120 170" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect x="22" y="6" width="76" height="140" rx="14" fill="#fff" stroke="#1d2433" stroke-width="5"/>
    <rect x="30" y="20" width="60" height="104" rx="4" fill="#eef1fb"/>
    <rect x="50" y="12" width="20" height="4" rx="2" fill="#1d2433"/>
    <circle cx="60" cy="134" r="4" fill="#1d2433"/>
    <g stroke="#9aa3b8" stroke-width="5" stroke-linecap="round">
      <path d="M38 62c13-11 31-11 44 0"/><path d="M46 73c8-6 20-6 28 0"/>
    </g>
    <circle cx="60" cy="86" r="4" fill="#9aa3b8"/>
    <path class="pulse" d="M36 34l48 62" stroke="#e5484d" stroke-width="6" stroke-linecap="round"/>
    <circle cx="92" cy="132" r="19" fill="#e5484d"/>
    <path d="M85 125l14 14M99 125l-14 14" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
  </svg>
  <h1>Internet nahi hai</h1>
  <p>Aapka phone offline hai. Wi-Fi ya mobile data on karein, phir dobara koshish karein.</p>
  <button id="r" type="button">🔄 Dobara koshish karein</button>
  <div class="s" id="s"></div>
</div>
<script>
  var URLX='__APP_URL__';
  function go(){ if(URLX.indexOf('__')===0){ location.reload(); } else { location.href=URLX; } }
  document.getElementById('r').onclick=function(){document.getElementById('s').textContent='Jaanch rahe hain…';setTimeout(go,300)};
  window.addEventListener('online',go);
  setInterval(function(){ if(navigator.onLine) go(); },6000);
</script>
</body></html>
